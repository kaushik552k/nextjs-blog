version: "3.8"

services:
  web:
    container_name: kaushik-blog
    build: .
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # This connection string tells Next.js how to talk to the DB
      # Format: postgres://user:password@host:port/dbname
      - DATABASE_URL=postgresql://kaushik:securepassword123@postgres:5432/blogdb
    depends_on:
      - postgres

  nginx:
    container_name: kaushik-gateway
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt # Where certs will live
      - ./certbot/www:/var/www/certbot # Where the challenge files live
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    container_name: kaushik-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  # --- THE NEW DATABASE ---
  postgres:
    image: postgres:15-alpine
    container_name: kaushik-postgres
    restart: always
    environment:
      POSTGRES_USER: kaushik
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: blogdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres-data:
