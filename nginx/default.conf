# ─────────────────────────────────────────────────────────────────────────────
# Nginx Performance Configuration
# Changes from original:
#   1. HTTP/2 enabled on port 443 — fixes "24 requests not served via HTTP/2"
#   2. gzip compression — reduces transfer size for HTML/CSS/JS by ~70%
#   3. /_next/static caching — immutable assets cached for 1 year in browser
#   4. /public asset caching — 1 day cache with stale-while-revalidate
#   5. HTML pages — no-cache (always validate freshness)
#   6. Security headers (bonus)
# ─────────────────────────────────────────────────────────────────────────────

# ─── Gzip ────────────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff
    font/woff2;

# ─── HTTP → HTTPS redirect (Port 80) ─────────────────────────────────────────
server {
    listen 80;
    server_name kaushikcodes.in www.kaushikcodes.in;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS (Port 443 with HTTP/2) ────────────────────────────────────────────
server {
    # http2 keyword enables HTTP/2 — fixes "24 requests not served via HTTP/2"
    listen 443 ssl;
    http2 on;
    server_name kaushikcodes.in www.kaushikcodes.in;

    ssl_certificate     /etc/letsencrypt/live/kaushikcodes.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaushikcodes.in/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Next.js static assets: cache forever (filenames are content-hashed) ───
    # Fixes "bfcache blocked" and eliminates repeat-visit JS/CSS downloads.
    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Content-hashed filenames → safe to cache for 1 year immutably
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── Next.js image optimization endpoint ──────────────────────────────────
    location /_next/image {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Images are also content-addressed via params — safe to cache
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # ── Public static files (favicon, OG images, etc.) ───────────────────────
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|otf)$ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        access_log off;
    }

    # ── All other requests → Next.js app ─────────────────────────────────────
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # HTML pages: always revalidate (Next.js ISR handles freshness)
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
