server {
    listen 80;
    server_name kaushikcodes.in www.kaushikcodes.in;

    # 1. The "Challenge" Location (Let's Encrypt uses this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 2. Everything else goes to the blog
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. The HTTPS Block (Port 443)
# This is where the real site lives
server {
    listen 443 ssl;
    server_name kaushikcodes.in www.kaushikcodes.in;

    ssl_certificate /etc/letsencrypt/live/kaushikcodes.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaushikcodes.in/privkey.pem;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}