# 1. MUST HAVE FOR WEBSOCKETS (Fixes the $connection_upgrade issue)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2. HTTP to HTTPS Redirect & Certbot Renewals (For ALL domains)
server {
    listen 80;
    # Add both your main domain and chat subdomain here
    server_name kaushikcodes.in www.kaushikcodes.in chat.kaushikcodes.in;

    # Let's Encrypt Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. THE CHAT APP & WEBSOCKETS (Port 443)
server {
    listen 443 ssl;
    server_name chat.kaushikcodes.in;

    # Chat SSL Certificates (The ones you just generated!)
    ssl_certificate /etc/letsencrypt/live/chat.kaushikcodes.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.kaushikcodes.in/privkey.pem;

    # The Chat Frontend
    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Socket.io Backend
    location /socket.io/ {
        proxy_pass http://host.docker.internal:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade; # Uses the map defined at the top
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
